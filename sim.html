/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

html, body { background: #efe9de; }
#app { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1c2422; font-size: 13px; }
#gl { touch-action: none; cursor: grab; }
.n-ui { position: absolute; inset: 0; pointer-events: none; --acc: #12b89a; }
.n-ui button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.n-card, .n-ph { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(20, 40, 36, 0.09); border-radius: 14px; pointer-events: auto; box-shadow: 0 6px 24px rgba(60, 50, 30, 0.08); }

.n-left { position: absolute; left: 20px; top: 20px; bottom: 20px; width: 290px; display: flex; flex-direction: column; gap: 10px; }
.n-head { padding: 14px 16px; }
.n-head b { display: block; font-size: 24px; font-weight: 800; letter-spacing: 0.04em; }
.n-head b i { font-style: normal; color: var(--acc); }
.n-head span { color: #5d6a66; font-size: 12.5px; }
.n-sys { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.n-sys button { padding: 9px 10px; border-radius: 9px; text-align: left; background: rgba(20, 40, 36, 0.045); font-weight: 600; }
.n-sys button:first-child { grid-column: 1 / 3; }
.n-sys button:hover, .n-scenes button:hover, .n-tools button:hover { background: rgba(18, 184, 154, 0.14); }
.n-ui button.on { background: var(--acc); color: #fff; }
.n-spec { padding: 14px 16px; overflow: auto; flex: 0 1 auto; }
.n-spec h3 { margin: 0 0 6px; font-size: 16px; }
.n-spec p { margin: 0 0 10px; line-height: 1.65; color: #3d4a46; }
.n-spec dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; border-top: 1px solid rgba(20, 40, 36, 0.09); padding-top: 10px; }
.n-spec dt { color: #6b7773; }
.n-spec dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.n-spec dd[data-live] { color: var(--acc); }

.n-bottom { position: absolute; left: 330px; right: 340px; bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.n-scenes, .n-tools { padding: 6px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.n-scenes button, .n-tools button { padding: 8px 13px; border-radius: 9px; font-weight: 600; white-space: nowrap; }
.n-tools { align-items: center; }
.n-tools label { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 600; }
.n-tools input { width: 150px; accent-color: var(--acc); }

.n-phone { position: absolute; right: 20px; top: 50%; width: 300px; transform: translateY(-50%) scale(var(--ps, 1)); transform-origin: right center; border-radius: 30px; border: 7px solid #1c2422; background: transparent; pointer-events: auto; box-shadow: 0 18px 50px rgba(40, 30, 10, 0.22); }
.n-ph { border-radius: 0; border: 0; box-shadow: none; backdrop-filter: none; background: #fff; }
.n-ph-top { border-radius: 23px 23px 0 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; }
.n-ph-top b { font-size: 15px; margin-right: auto; }
.n-ph-top span { font-size: 12px; color: #5d6a66; display: flex; align-items: center; gap: 5px; }
.n-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
.n-cam { position: relative; height: 161px; overflow: hidden; background: transparent; }
.n-cam i { position: absolute; inset: 0 10px; border-radius: 12px; box-shadow: 0 0 0 30px #fff; }
.n-cam em { position: absolute; left: 20px; top: 9px; font: 600 10px 'JetBrains Mono', monospace; color: #fff; background: #e5484d; padding: 2px 6px; border-radius: 4px; font-style: normal; }
.n-cam u { position: absolute; right: 20px; bottom: 9px; font: 600 10px 'JetBrains Mono', monospace; color: #fff; text-decoration: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
.n-ph-body { border-radius: 0 0 23px 23px; padding: 10px 12px 14px; }
.n-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.n-stats div { background: #f4f2ec; border-radius: 9px; padding: 6px 8px; }
.n-stats span { display: block; font-size: 10.5px; color: #6b7773; }
.n-stats b { font: 700 15px 'JetBrains Mono', 'PingFang SC', monospace; }
.n-stats small { font-size: 10px; color: #6b7773; margin-left: 3px; }
.n-sub { font-size: 11px; color: #6b7773; margin: 10px 2px 6px; font-weight: 600; }
.n-devs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.n-devs button { background: #f4f2ec; border-radius: 9px; padding: 8px 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.n-devs button span { font-size: 10px; opacity: 0.65; }
.n-ctl { display: flex; gap: 8px; align-items: stretch; }
.n-pad { display: grid; grid-template-columns: repeat(3, 28px); grid-template-rows: repeat(2, 28px); gap: 3px; }
.n-pad button { background: #f4f2ec; border-radius: 7px; font-size: 11px; touch-action: none; }
.n-pad button:active { background: var(--acc); color: #fff; }
.n-pad button:nth-child(1) { grid-column: 2; grid-row: 1; }
.n-pad button:nth-child(2) { grid-column: 1; grid-row: 2; }
.n-pad button:nth-child(3) { grid-column: 2; grid-row: 2; }
.n-pad button:nth-child(4) { grid-column: 3; grid-row: 2; }
.n-player { flex: 1; background: #f4f2ec; border-radius: 9px; padding: 6px 8px; min-width: 0; }
.n-song { display: flex; align-items: center; gap: 7px; }
.n-song div { flex: 1; line-height: 1.2; }
.n-song b { display: block; font-size: 12px; }
.n-song span { font-size: 10px; color: #6b7773; }
#n-play { width: 24px; height: 24px; border-radius: 50%; background: var(--acc); color: #fff; font-size: 10px; }
.n-bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; margin-top: 5px; }
.n-bars i { flex: 1; background: var(--acc); border-radius: 1px; height: 8%; }

.n-labels div { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: rgba(28, 36, 34, 0.86); color: #fff; }
.n-bubble { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.2s; max-width: 260px; font-size: 15px; font-weight: 600; padding: 9px 14px; border-radius: 16px 16px 16px 4px; background: #fff; box-shadow: 0 6px 20px rgba(40, 30, 10, 0.16); white-space: nowrap; }
.n-bubble.on { opacity: 1; }
.n-tour { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-size: 12px; padding: 5px 12px; border-radius: 20px; background: rgba(28, 36, 34, 0.8); color: #fff; }
.n-tour.on { opacity: 1; }

@media (max-width: 1080px) { .n-left { display: none; } .n-bottom { left: 12px; } }
@media (max-width: 720px) { .n-phone { display: none; } .n-bottom { right: 12px; } }
.n-styles { display: flex; gap: 6px; margin-top: 10px; }
.n-styles button { flex: 1; padding: 7px 0; border-radius: 9px; background: rgba(20, 40, 36, 0.045); font-weight: 600; }
.n-styles button:hover { background: rgba(18, 184, 154, 0.14); }
.n-spec p b { color: #1c2422; }
.n-links { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; font-weight: 600; }
.n-links a { color: var(--acc); text-decoration: none; }
.n-off .n-left, .n-off .n-phone, .n-off .n-scenes, .n-off .n-bubble, .n-off .n-tour { display: none; }
.n-off .n-bottom { left: 20px; right: 20px; }
.n-off .n-tools { background: rgba(255, 255, 255, 0.72); }
.n-hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-size: 13px; padding: 7px 14px; border-radius: 20px; background: rgba(28, 36, 34, 0.82); color: #fff; white-space: nowrap; pointer-events: none; }
.n-hint.on { opacity: 1; }
.n-ui:not(.n-off) .n-hint { display: none; }

</style>
