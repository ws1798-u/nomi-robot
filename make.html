<meta charset="utf-8">

<title>Nomi 制造流程 · 选材 · 成本</title>
<meta name="description" content="Nomi 陪伴机器人怎么做出来：从样机到量产的流程、每个零件的选材和工艺、物料成本和一次性投入。">

<link rel="stylesheet" href="site.css">
<style>
.draw { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 12px 0 18px; }
.draw > div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.draw svg { display: block; width: 100%; height: auto; }
.draw .cap { font-size: 14px; color: #3d4a46; margin: 10px 0 0; }
.draw .o { fill: #f4f5f7; stroke: #0b0c0e; stroke-width: 1.4; }
.draw .bg { fill: var(--card); stroke: none; }
.draw .cv { fill: #20262b; fill-opacity: .85; stroke: #0b0c0e; stroke-width: 1; }
.draw .ink { stroke: #0c8f79; stroke-width: 2.5; }
.draw .gk { fill: #5d6470; }
.draw .pcb { fill: #0c8f79; fill-opacity: .55; stroke: #0c8f79; }
.draw .chip { fill: #2a2d31; }
.draw .bm { stroke: #0c8f79; stroke-width: 1.6; }
.draw .bm2 { stroke: #0c8f79; stroke-width: 1; stroke-dasharray: 4 3; }
.draw .ax { stroke: #0c8f79; stroke-width: 1; stroke-dasharray: 8 3 2 3; }
.draw .ref, .draw .g { stroke: #9aa1ab; stroke-width: 1; }
.draw .bad { stroke: #c2533f; stroke-width: 1.3; stroke-dasharray: 5 4; }
.draw text.bad { fill: #c2533f; stroke: none; }
.draw .hit { fill: #c2533f; } .draw .dot { fill: #0c8f79; }
.draw .ld { stroke: #5d6470; stroke-width: .8; }
.draw .lb { font: 500 12.5px sans-serif; fill: #0b0c0e; }
.draw .lb.acc { fill: #0c8f79; } .draw .lb.mut { fill: #5d6470; }
@media (max-width: 860px) { .draw { grid-template-columns: 1fr; } }
</style>
<style>
/* 查看制造编码 */
#gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); }
#gate[hidden] { display: none; }
#gate .g-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px 22px; box-shadow: 0 24px 60px rgba(11, 12, 14, 0.12); }
#gate h1 { font-size: 22px; line-height: 1.3; margin: 0 0 6px; letter-spacing: 0; }
#gate p { margin: 0 0 18px; color: var(--sub); font-size: 15px; line-height: 1.6; }
#gate input { width: 100%; box-sizing: border-box; font: inherit; font-size: 22px; letter-spacing: 0.3em; text-align: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); outline: none; }
#gate input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(12, 143, 121, 0.18); }
#gate button { width: 100%; margin-top: 12px; font: inherit; font-size: 16px; font-weight: 600; padding: 11px; border: 0; border-radius: 10px; background: var(--btn); color: #fff; cursor: pointer; }
#gate button:disabled { opacity: 0.6; cursor: wait; }
#gate .g-err { min-height: 22px; margin: 8px 0 0; color: #c2533f; font-size: 14px; text-align: center; }
#gate .g-back { display: block; margin-top: 10px; text-align: center; font-size: 14px; color: var(--sub); }
#gate.shake .g-card { animation: g-shake 0.35s; }
@keyframes g-shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
html.has-key body { padding-top: 0; }
</style>
<script>
/* 本机 3 天内输过编码：先不显示输入框，直接解密，避免闪一下 */
(function () {
  try { var k = JSON.parse(localStorage.getItem('nomi-make-key') || 'null'); if (k && Date.now() - k.t < 259200000) document.documentElement.classList.add('has-key'); } catch (e) {}
})();
</script>
</head>
<body>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="g-title">
  <form class="g-card" id="g-form" autocomplete="off">
    <h1 id="g-title">查看制造文档</h1>
    <p>请输入查看制造编码。输对后 3 天内不用再输。</p>
    <input id="g-code" type="password" inputmode="numeric" maxlength="20" placeholder="制造编码" aria-label="制造编码">
    <button type="submit" id="g-btn">查看</button>
    <div class="g-err" id="g-err" aria-live="polite"></div>
    <a class="g-back" href="index.html">返回首页</a>
  </form>
</div>

<script>
(function () {
  var KEY = 'nomi-make-key', TTL = 259200000;
  var P = JSON.parse(document.getElementById('enc').textContent);
  var root = document.documentElement, gate = document.getElementById('gate'), page = document.getElementById('page');
  var form = document.getElementById('g-form'), input = document.getElementById('g-code'), err = document.getElementById('g-err'), btn = document.getElementById('g-btn');
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var hex = function (s) { return new Uint8Array(s.match(/../g).map(function (h) { return parseInt(h, 16); })); };
  var toB64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };

  function show(html) {
    page.innerHTML = html;
    // innerHTML 不会执行 <script>，逐个换成新的 script 让它跑起来
    page.querySelectorAll('script').forEach(function (old) {
      var s = document.createElement('script');
      for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    gate.hidden = true;
    root.classList.remove('has-key');
    // 带 #小节 打开时，等排版稳定后再跳过去
    if (location.hash) {
      var jump = function () { var el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView({ block: 'start', behavior: 'instant' }); };
      requestAnimationFrame(jump); setTimeout(jump, 400);
    }
  }
  function decrypt(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)).then(function (b) { return new TextDecoder().decode(b); });
  }
  function derive(code) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: hex(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function ask() { root.classList.remove('has-key'); gate.hidden = false; setTimeout(function () { input.focus(); }, 50); }

  // 3 天内输过：用存着的钥匙直接解密
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (saved && Date.now() - saved.t < TTL) {
    gate.hidden = true;
    crypto.subtle.importKey('raw', b64(saved.k), 'AES-GCM', false, ['decrypt']).then(decrypt).then(show).catch(function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      ask();
    });
  } else {
    try { localStorage.removeItem(KEY); } catch (e) {}
    ask();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = input.value.trim();
    if (!code) return;
    btn.disabled = true; btn.textContent = '正在打开…'; err.textContent = '';
    var key;
    derive(code).then(function (k) { key = k; return decrypt(k); }).then(function (html) {
      return crypto.subtle.exportKey('raw', key).then(function (raw) {
        try { localStorage.setItem(KEY, JSON.stringify({ k: toB64(raw), t: Date.now() })); } catch (e2) {}
        show(html);
      });
    }).catch(function () {
      err.textContent = '编码不对，请再试一次';
      input.select();
      gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
    }).then(function () { btn.disabled = false; btn.textContent = '查看'; });
  });
})();
</script>
